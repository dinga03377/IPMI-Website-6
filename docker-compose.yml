services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ipmi
      POSTGRES_USER: ipmi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ipmi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipmi -d ipmi"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  ipmi_pg:
